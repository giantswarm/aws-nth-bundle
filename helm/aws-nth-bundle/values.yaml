# Chart deployed by the bundle, in the same shape as the other bundles. The OCIRepository
# URL is oci://gsoci.azurecr.io/charts/giantswarm/<chartName> and its tag is `version`.
apps:
  awsNodeTerminationHandler:
    chartName: aws-node-termination-handler
    version: "2.1.1"

# Deprecated: overrides the OCIRepository URL derived from `apps.*.chartName`. Leave empty.
ociRepositoryUrl: ""
clusterID: ""
managementCluster: ""
region: ""

awsNodeTerminationHandler:
  # HelmReleases that the subchart aws-node-termination-handler HelmRelease depends on. Each `name`
  # is automatically prefixed with `clusterID` to match the bundle's HelmRelease naming convention.
  dependsOn:
    - name: prometheus-operator-crd
    - name: aws-pod-identity-webhook
    - name: kyverno-crds
