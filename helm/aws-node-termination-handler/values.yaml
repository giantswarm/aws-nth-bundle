# --- UPSTREAM -------------------------------------------------------------------
upstream:
  nameOverride: aws-node-termination-handler

  image:
    repository: gsoci.azurecr.io/giantswarm/aws-node-termination-handler

# --- EXTRAS ---------------------------------------------------------------------
networkPolicy:
  enabled: true

verticalPodAutoscaler:
  enabled: true
  maxAllowed:
    cpu: 200m
    memory: 200Mi
  minAllowed:
    cpu: 50m
    memory: 50Mi

kyvernoPolicyExceptions:
  enabled: true
  legacy:
    # Renders the kyverno.io/v2 PolicyException, which applies to ClusterPolicies only. Will be used as a global switch in a future release.
    enabled: true
